# Plugin version: independent of the formatter version.
pluginVersion=0.1.0
# The formatter this plugin downloads, and the protocol it speaks.
bundledFormatterVersion=0.1.0-dev
protocolVersion=1
# Supported IDE builds (see docs/editors/intellij.md).
sinceBuild=243
untilBuild=253.*
# IDE to build and test against; CI uses a downloaded IntelliJ IDEA Community.
platformType=IC
platformVersion=2024.3.6
# Set to a local IDE (e.g. /Applications/Android Studio.app) to build without downloading one.
localPlatformPath=
kotlin.stdlib.default.dependency=false
org.gradle.jvmargs=-Xmx2g
